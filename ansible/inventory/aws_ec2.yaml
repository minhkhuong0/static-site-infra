plugin: amazon.aws.aws_ec2
use_deprecated_tags: false

regions:
  - eu-central-1

filters:
  instance-state-name: running
  "tag:ManagedBy": opentofu
  "tag:Project": static-site

hostnames: instance-id

keyed_groups:
  - key: ec2_tags.Project
    prefix: project

compose:
  domain: ec2_tags.DomainName
