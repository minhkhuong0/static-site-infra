- name: Add repo
  include_tasks: setup-Debian.yaml
  when: ansible_facts.os_family == 'Debian'

- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  become: true
